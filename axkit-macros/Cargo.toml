[package]
name = "axkit-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["axum", "openapi", "macro", "utoipa"]
categories = ["web-programming::http-server"]
description = "Route attribute macros for axkit: axum routing, OpenAPI and tracing from one annotation."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2", features = ["full"] }
