[package]
name = "appkit-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Route attribute macros for appkit: axum routing, OpenAPI and tracing from one annotation."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2", features = ["full"] }
