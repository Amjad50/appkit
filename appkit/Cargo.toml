[package]
name = "appkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A small layer over axum: auto-registered routes, OpenAPI, config, telemetry, tasks."

[dependencies]
appkit-macros = { version = "0.1.0", path = "../appkit-macros" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "multipart", "query", "tokio"] }
config = { version = "0.15", default-features = false }
dotenvy = "0.15.7"
inventory = "0.3.25"
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "signal", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "limit", "timeout", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]
