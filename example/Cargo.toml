[package]
name = "example"
version = "0.0.0"
edition.workspace = true
publish = false

# Only axkit, serde and tokio: axum and utoipa come through `axkit::prelude`.
[dependencies]
axkit = { path = "../axkit" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
